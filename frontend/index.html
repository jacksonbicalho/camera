<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <title>os-camera</title>
    <meta name="description" content="Monitoramento residencial via RTSP" />

    <!-- Open Graph (ogp.me) — og:url/og:image levam o placeholder
         %%OG_ORIGIN%%, substituído pela origem real da request em
         internal/server/server.go (spaHandler); o sistema é auto-hospedado,
         sem domínio fixo conhecido em build-time. -->
    <meta property="og:title" content="os-camera" />
    <meta property="og:type" content="website" />
    <meta property="og:description" content="Monitoramento residencial via RTSP" />
    <meta property="og:site_name" content="os-camera" />
    <meta property="og:url" content="%%OG_ORIGIN%%/" />
    <meta property="og:image" content="%%OG_ORIGIN%%/icon-192.png" />
    <meta property="og:image:width" content="192" />
    <meta property="og:image:height" content="192" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="os-camera" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="os-camera" />
    <meta name="twitter:description" content="Monitoramento residencial via RTSP" />
    <meta name="twitter:image" content="%%OG_ORIGIN%%/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
