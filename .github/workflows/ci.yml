name: CI

on:
  pull_request:
    branches:
      - master
      - develop

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Build frontend (required by go:embed)
        run: cd frontend && yarn install --frozen-lockfile && yarn build

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install
        run: cd frontend && yarn install --frozen-lockfile

      - name: Lint
        run: cd frontend && yarn lint

      - name: Test
        run: cd frontend && yarn test --run

      - name: Build
        run: cd frontend && yarn build

  docker:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Guard: builda a imagem de produção (amd64, sem push) para pegar quebra do
      # Dockerfile / go:embed do frontend nos PRs. O multi-arch completo + push roda
      # só no release (release.yml).
      - name: Build production image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: false

  yolo:
    name: YOLO service
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Os testes stubam torch/ultralytics/cv2 via sys.modules, então só precisam
      # de fastapi/pydantic/pyyaml/httpx/pytest — sem torch/GPU.
      - name: Install test deps
        run: pip install fastapi pydantic pyyaml httpx pytest

      - name: Test
        run: cd services/yolo && python -m pytest -q

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Tudo em Docker (build da imagem `e2e` + harness Playwright) — o
      # runner já traz docker/compose, sem setup adicional. Suíte enxuta de
      # propósito (smoke, não escala) pra não pesar o ciclo automático de PR
      # (scripts/merge-when-green.sh espera todos os check-runs).
      - name: Run e2e suite
        run: bash scripts/e2e.sh
