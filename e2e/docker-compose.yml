# Harness e2e — tudo em Docker. Dois serviços numa rede compartilhada: o
# servidor (`e2e-camera`, imagem `e2e` do Dockerfile raiz, que semeia o
# fixture e sobe) e o `e2e-playwright`, que o alcança pelo nome do serviço
# (http://e2e-camera:8099) — sem --network host, portável. Orquestrado por
# scripts/e2e.sh. Nomes com prefixo `e2e-` (não sufixo) — convenção do
# projeto pra serviços não-produção: agrupa por contexto (`docker compose ...
# e2e-<tab>`) e evita colisão com o `camera` de produção do docker-compose.yml
# raiz quando este arquivo é incluído nele (profile `development`, ver lá).
#
# x-fixture-env: ids/credenciais do fixture semeado — ÚNICA declaração destes
# valores no repo (os defaults abaixo; ver e2e/.env.example pra sobrescrever
# sem editar este arquivo). `e2e-camera` os repassa pro seed via
# docker-entrypoint.sh (flags -admin-user/-camera-id/etc., e2e/seed/main.go);
# `e2e-playwright` os expõe aos specs (fallback quando ausentes, para rodar
# fora do compose também funcionar). Sem o anchor, os mesmos valores
# precisariam ser copiados nos dois blocos `environment:` abaixo, com risco
# de divergirem.
x-fixture-env: &fixture-env
  E2E_ADMIN_USER: ${E2E_ADMIN_USER:-admin}
  E2E_ADMIN_PASS: ${E2E_ADMIN_PASS:-e2e-password-123}
  E2E_CAMERA_ID: ${E2E_CAMERA_ID:-e2e00000-0000-4000-8000-000000000001}
  E2E_ADMIN_ONLY_CAMERA_ID: ${E2E_ADMIN_ONLY_CAMERA_ID:-e2e00000-0000-4000-8000-000000000002}
  E2E_VIEWER_USER: ${E2E_VIEWER_USER:-viewer}
  E2E_VIEWER_PASS: ${E2E_VIEWER_PASS:-e2e-viewer-password-123}

services:
  e2e-camera:
    build:
      context: ..
      dockerfile: Dockerfile
      target: e2e
    environment:
      <<: *fixture-env
      E2E_RECORDINGS: '5'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://127.0.0.1:8099/api/config']
      interval: 2s
      timeout: 3s
      retries: 30

  # Roda o pacote e2e/ (T3) com bun — mesma imagem usada pelo check de
  # tooling (scripts/e2e-lint-check.sh), instala os browsers do
  # Playwright na hora (cache em volume nomeado entre execuções).
  e2e-playwright:
    image: oven/bun:1
    depends_on:
      e2e-camera:
        condition: service_healthy
    working_dir: /e2e
    volumes:
      - ./:/e2e
      - e2e-bun-cache:/root/.bun/install/cache
    environment:
      <<: *fixture-env
      E2E_BASE_URL: http://e2e-camera:8099
      # recording_id=1 não vem do anchor: é sempre a 1ª linha inserida num
      # banco novo (autoincrement), não um valor configurável do seed.
      E2E_RECORDING_ID: '1'
      # Overrides opcionais de e2e/playwright.config.ts — ${VAR:-default}
      # lê do ambiente do host ou de um e2e/.env (não versionado; ver
      # e2e/.env.example), sem precisar editar este arquivo pra depurar
      # localmente (ex: `E2E_VIDEO=on bash scripts/e2e.sh`).
      E2E_REPORTER: ${E2E_REPORTER:-list}
      E2E_SCREENSHOT: ${E2E_SCREENSHOT:-only-on-failure}
      E2E_VIDEO: ${E2E_VIDEO:-off}
      E2E_PDF_REPORT: ${E2E_PDF_REPORT:-off}
    command: >
      sh -c "bun install &&
             bunx playwright install --with-deps chromium &&
             bunx playwright test"

volumes:
  e2e-bun-cache:
