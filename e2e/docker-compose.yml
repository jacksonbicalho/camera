# Harness e2e — tudo em Docker. Dois serviços numa rede compartilhada: o servidor
# (imagem `e2e` do Dockerfile, que semeia o fixture e sobe) e o Playwright, que o
# alcança por nome de serviço (`http://camera:8099`) — sem --network host, portável.
# Orquestrado por scripts/e2e.sh.
services:
  camera:
    build:
      context: ..
      dockerfile: Dockerfile
      target: e2e
    environment:
      CAMERA_SERVER_JWT_SECRET: e2e-fixed-secret
      # Escala: smoke + perf rodam contra o mesmo fixture (o smoke navega pela
      # gravação mais antiga, recording_id=1). ~representativo do dia real (~2.851).
      E2E_RECORDINGS: "1500"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8099/api/config"]
      interval: 2s
      timeout: 3s
      retries: 30

  playwright:
    image: mcr.microsoft.com/playwright:v1.49.1-jammy
    depends_on:
      camera:
        condition: service_healthy
    working_dir: /e2e
    volumes:
      - ./:/e2e
      - e2e-npm:/root/.npm
    environment:
      E2E_BASE_URL: http://camera:8099
      # Ids fixos do fixture (câmera com id fixo; recording_id=1 no DB novo).
      E2E_CAMERA_ID: e2e00000-0000-4000-8000-000000000001
      E2E_RECORDING_ID: "1"
      E2E_ADMIN_USER: admin
      E2E_ADMIN_PASS: e2e-password-123
    command: sh -c "npm install --no-save @playwright/test@1.49.1 >/dev/null 2>&1 && npx playwright test"

volumes:
  e2e-npm:
