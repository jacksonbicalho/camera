# Override só para o devcontainer (referenciado apenas por devcontainer.json,
# nunca pelos scripts/make run — esses continuam usando o docker-compose.yml
# raiz sozinho). O Dev Containers CLI do VSCode não sabe lidar com profiles do
# Compose: ele roda `docker compose ... up -d --no-recreate` sem `--profile`
# nem nome de serviço, então com TODO serviço do compose raiz atrás de um
# profile (camera/production, dev-camera+e2e-*/development), o Compose não
# seleciona nada e falha com "no service selected". Zerar aqui só o profile do
# dev-camera (via `!override`, que substitui a lista em vez de concatenar,
# comportamento padrão do merge do Compose para listas) o torna elegível ao
# "up" sem profile do devcontainer, sem tirar o gate `--profile development`
# de ninguém que use o docker-compose.yml raiz diretamente — e sem trazer
# camera/e2e-* junto, que continuam atrás dos próprios profiles.
services:
  dev-camera:
    profiles: !override []
