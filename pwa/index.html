<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icons/icon.svg" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/app.css" />
    <title>os-camera</title>
  </head>
  <body>
    <section id="view-login">
      <form id="login-form">
        <h1>os-camera</h1>
        <label>
          Servidor
          <input id="login-server" name="server" type="text" placeholder="http://192.168.1.10:8080" autocomplete="url" required />
        </label>
        <label>
          Usuário
          <input id="login-username" name="username" type="text" autocomplete="username" required />
        </label>
        <label>
          Senha
          <input id="login-password" name="password" type="password" autocomplete="current-password" required />
        </label>
        <p id="login-error" class="error" role="alert"></p>
        <button id="login-submit" type="submit">Entrar</button>
      </form>
    </section>

    <div id="app-shell" hidden>
      <section id="view-cameras" class="view">
        <div class="view-header">
          <h1>Câmeras</h1>
          <span id="cameras-count" class="mono-label"></span>
        </div>
        <div id="camera-grid"></div>
      </section>

      <section id="view-history" class="view" hidden>
        <div class="view-header">
          <h1>Histórico</h1>
        </div>
        <div id="history-toolbar">
          <select id="history-camera-select"></select>
          <div id="history-month-nav">
            <button id="history-prev-month" type="button" aria-label="Mês anterior">&lsaquo;</button>
            <span id="history-month-label" class="mono-label"></span>
            <button id="history-next-month" type="button" aria-label="Próximo mês">&rsaquo;</button>
          </div>
        </div>
        <div id="history-calendar-card">
          <div id="history-weekdays" class="calendar-row"></div>
          <div id="history-calendar-grid" class="calendar-row"></div>
        </div>
        <div id="history-timeline-label" class="section-label"></div>
        <div id="history-timeline"></div>
      </section>

      <section id="view-notifications" class="view" hidden>
        <div class="view-header">
          <h1>Notificações</h1>
        </div>
        <div id="notifications-list"></div>
      </section>

      <section id="view-settings" class="view" hidden>
        <div class="view-header">
          <h1>Ajustes</h1>
        </div>
        <div id="settings-content">
          <div class="settings-field">
            <span class="settings-field-label">Servidor</span>
            <span id="settings-server-value" class="settings-field-value mono-label"></span>
          </div>
          <button id="settings-logout-button" type="button" class="danger-button">Sair</button>
        </div>
      </section>

      <nav id="tab-bar">
        <button id="tab-cameras" type="button" class="tab-button" data-tab="cameras">
          <span class="tab-icon"></span>
          <span class="tab-label">Câmeras</span>
        </button>
        <button id="tab-history" type="button" class="tab-button" data-tab="history">
          <span class="tab-icon"></span>
          <span class="tab-label">Histórico</span>
        </button>
        <button id="tab-notifications" type="button" class="tab-button" data-tab="notifications">
          <span class="tab-icon"></span>
          <span class="tab-label">Notif.</span>
        </button>
        <button id="tab-settings" type="button" class="tab-button" data-tab="settings">
          <span class="tab-icon"></span>
          <span class="tab-label">Ajustes</span>
        </button>
      </nav>
    </div>

    <section id="view-detail" hidden>
      <div id="detail-live-overlay">
        <div id="detail-live-badge">
          <span id="detail-live-dot"></span>
          <span>AO VIVO</span>
        </div>
        <span id="detail-live-res" class="mono-label"></span>
      </div>
      <button id="detail-back-button" type="button" aria-label="Voltar">&larr;</button>
      <img id="detail-image" alt="" />
      <div id="detail-footer">
        <div id="detail-title"></div>
        <div id="detail-controls">
          <button id="detail-snapshot-button" type="button" class="detail-control">
            <span class="detail-control-icon"></span>
            <span>Snapshot</span>
          </button>
          <button id="detail-fullscreen-button" type="button" class="detail-control">
            <span class="detail-control-icon"></span>
            <span>Tela cheia</span>
          </button>
        </div>
      </div>
    </section>

    <section id="view-recording" hidden>
      <div id="recording-header">
        <button id="recording-back-button" type="button" aria-label="Voltar">&larr;</button>
        <div id="recording-title"></div>
      </div>
      <video id="recording-video" controls playsinline muted autoplay></video>
    </section>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
