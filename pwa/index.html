<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icons/icon.svg" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./css/app.css" />
    <title>os-camera</title>
  </head>
  <body>
    <section id="view-login">
      <form id="login-form">
        <h1>os-camera</h1>
        <label>
          Servidor
          <input id="login-server" name="server" type="text" placeholder="http://192.168.1.10:8080" autocomplete="url" required />
        </label>
        <label>
          Usuário
          <input id="login-username" name="username" type="text" autocomplete="username" required />
        </label>
        <label>
          Senha
          <input id="login-password" name="password" type="password" autocomplete="current-password" required />
        </label>
        <p id="login-error" class="error" role="alert"></p>
        <button id="login-submit" type="submit">Entrar</button>
      </form>
    </section>

    <section id="view-grid" hidden>
      <div class="top-bar">
        <h1>Câmeras</h1>
        <button id="logout-button" type="button">Sair</button>
      </div>
      <div id="camera-grid"></div>
    </section>

    <section id="view-detail" hidden>
      <div class="top-bar">
        <button id="detail-back-button" type="button">&larr; Voltar</button>
        <h1 id="detail-title"></h1>
        <span></span>
      </div>
      <img id="detail-image" alt="" />
    </section>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
