# Nomes de serviço não-produção usam prefixo (<contexto>-<coisa>): `camera`
# (produção, único sem qualificador) permanece como está; `dev-camera` é o
# ambiente de desenvolvimento local (live reload).
services:
  camera:
    profiles: [production]
    image: jacksonbicalho/os-camera:latest
    build:
      context: .
      target: production
      args:
        VERSION: ${VERSION:-dev}
    network_mode: host
    volumes:
      - ./camera.yaml:/app/camera.yaml:ro
      - ./storage:/data
    restart: unless-stopped

  dev-camera:
    profiles: [development]
    image: camera:development
    container_name: camera_teste2
    build:
      context: .
      target: development
    network_mode: host
    #user: "${UID}:${GID}"
    volumes:
      - .:/app
      - ./storage:/data
      #- frontend_node_modules:/app/frontend/node_modules
    env_file:
      - path: .env
        required: false
    environment:
      - VERSION=${VERSION:-dev}
      - GOCACHE=/app/.cache/go-build
      - HOME=/tmp
    command: sh -c "cd frontend && yarn build && cd .. && go run -ldflags=\"-X main.version=$$VERSION\" ./cmd/camera --config /app/camera.yaml"
    restart: "no"

  testing-camera:
    profiles: [development]
    image: camera:development
    container_name: testing_camera
    build:
      context: .
      target: development
    network_mode: host
    #user: "${UID}:${GID}"
    volumes:
      - .:/app
      - /data
      #- frontend_node_modules:/app/frontend/node_modules
    env_file:
      - path: .env
        required: false
    environment:
      - VERSION=${VERSION:-dev}
      - GOCACHE=/app/.cache/go-build
      - HOME=/tmp
    command: sh -c "cd frontend && yarn build && cd .. && go run -ldflags=\"-X main.version=$$VERSION\" ./cmd/camera --config /app/camera-testing.yaml"
    restart: "no"








volumes:
  frontend_node_modules:
