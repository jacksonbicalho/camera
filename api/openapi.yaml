openapi: 3.1.0

info:
  title: os-camera API
  version: "1.0.0"
  summary: Monitoramento residencial via RTSP — gravação, live, detecção de movimento e análise.
  description: |
    API REST do `os-camera`. Este arquivo é o **contrato**: um teste
    (`internal/server/openapi_test.go`) compara cada operação aqui com a tabela
    de rotas do servidor (`internal/server/routes.go`) e falha o build quando as
    duas divergem — em path, método ou nível de acesso.

    O guia narrativo para integradores (autenticação, papéis, SSE, exemplos
    `curl`, armadilhas com token) está em [`docs/api.md`](../docs/api.md).

    ## Autenticação

    Todos os endpoints protegidos aceitam o JWT de duas formas:

    - `Authorization: Bearer <token>` — preferido.
    - `?token=<token>` — necessário onde não é possível definir headers
      (`<video src>`, `EventSource`/SSE, `<img src>`).

    ⚠️ O segredo do JWT é **gerado a cada boot** do servidor a menos que
    `OS_CAMERA_JWT_SECRET` esteja definido: sem essa variável, todo token de um
    app externo é invalidado quando o servidor reinicia. Tokens expiram em 24h.

    ## Níveis de acesso (`x-auth`)

    Cada operação declara a extensão `x-auth`, que espelha o middleware que o
    servidor de fato aplica:

    | `x-auth` | Significado |
    |---|---|
    | `public` | sem token |
    | `change-password` | token válido, inclusive com `must_change_password=true` |
    | `full` | token válido cuja troca de senha obrigatória já foi feita |
    | `admin` | `full` + `role=admin` |
    | `camera` | token válido + acesso à câmera do path (`admin` sempre tem) |

    ## Erros

    Erros são **`text/plain`**, não JSON — o corpo é uma frase curta
    (`unauthorized`, `invalid body`, `forbidden`). Programe contra o **status**,
    nunca contra o texto.
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Instância local (porta padrão do `camera.yaml`)

tags:
  - name: auth
    description: Login, troca e recuperação de senha.
  - name: system
    description: Versão, estatísticas, configuração do cliente e atualizações.
  - name: cameras
    description: Leitura das câmeras acessíveis ao usuário.
  - name: recordings
    description: Gravações MP4 e dias com conteúdo.
  - name: motion
    description: Eventos de movimento, scores ao vivo e zonas de exclusão.
  - name: events
    description: Eventos, rótulos e anotações (dataset de fine-tuning).
  - name: live
    description: Ao vivo — sinalização WebRTC e segmentos HLS.
  - name: notifications
    description: Notificações por usuário.
  - name: me
    description: Perfil e preferências do usuário autenticado.
  - name: users
    description: Administração de usuários.
  - name: settings
    description: Configuração de câmeras, storage, drives e retenção.
  - name: analysis
    description: Análise YOLO e fine-tuning.
  - name: state-classification
    description: Classificadores de estado por câmera.

security:
  - bearerAuth: []
  - tokenQuery: []

paths:
  # ---------------------------------------------------------------- auth
  /api/auth/login:
    post:
      tags: [auth]
      summary: Autentica e devolve um JWT (24h)
      description: O campo `username` aceita **username ou e-mail**.
      x-auth: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, examples: [admin] }
                password: { type: string, format: password }
      responses:
        "200":
          description: Token emitido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }

  /api/auth/change-password:
    post:
      tags: [auth]
      summary: Troca a senha (fluxo obrigatório de primeiro login)
      description: |
        Único endpoint acessível enquanto o token carrega
        `must_change_password=true`.
      x-auth: change-password
      responses:
        "200": { description: Senha trocada; o próximo login emite token sem a flag. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auth/forgot-password:
    post:
      tags: [auth]
      summary: Envia o link de recuperação de senha
      description: |
        Responde **sempre** `200`, exista o e-mail ou não (não vaza cadastro).
        Sem SMTP configurado é um no-op silencioso.
      x-auth: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200": { description: Requisição aceita (independente de o e-mail existir). }

  /api/auth/reset-password:
    post:
      tags: [auth]
      summary: Redefine a senha a partir do token do e-mail
      x-auth: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, description: Token do link; expira em 30 min. }
                password: { type: string, format: password }
      responses:
        "200": { description: Senha redefinida. }
        "400": { $ref: "#/components/responses/BadRequest" }

  # ---------------------------------------------------------------- system
  /api/config:
    get:
      tags: [system]
      summary: Configuração pública do cliente
      description: Consumida pela SPA antes do login.
      x-auth: public
      security: []
      responses:
        "200":
          description: Configuração do cliente.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/about:
    get:
      tags: [system]
      summary: Versão, build e notas da release instalada
      x-auth: full
      responses:
        "200":
          description: Informações de build.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/About" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/stats:
    get:
      tags: [system]
      summary: Estatísticas globais (disco, gravações, host)
      x-auth: full
      responses:
        "200":
          description: Estatísticas agregadas.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stats" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/settings:
    get:
      tags: [settings]
      summary: Configuração completa (câmeras, storage, retenção)
      x-auth: admin
      responses:
        "200":
          description: Configuração.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/updates:
    get:
      tags: [system]
      summary: Há atualização disponível?
      x-auth: admin
      responses:
        "200":
          description: Status da checagem de atualização.
          content:
            application/json:
              schema:
                type: object
                properties:
                  apply_mode: { type: string }
                additionalProperties: true
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/updates/apply:
    post:
      tags: [system]
      summary: Aplica a atualização disponível
      x-auth: admin
      responses:
        "200": { description: Atualização iniciada. }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------- cameras
  /api/cameras:
    get:
      tags: [cameras]
      summary: Câmeras acessíveis ao usuário
      description: Admin vê todas; viewer só as concedidas.
      x-auth: full
      responses:
        "200":
          description: Lista de câmeras.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Camera" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/cameras/{id}/snapshot:
    parameters: [{ $ref: "#/components/parameters/CameraId" }]
    get:
      tags: [cameras]
      summary: Snapshot JPEG atual da câmera
      x-auth: camera
      responses:
        "200":
          description: Imagem.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/cameras/{id}/stats:
    parameters: [{ $ref: "#/components/parameters/CameraId" }]
    get:
      tags: [cameras]
      summary: Estatísticas de uma câmera
      x-auth: camera
      responses:
        "200":
          description: Estatísticas da câmera.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraStats" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/cameras/{id}/device-info:
    parameters: [{ $ref: "#/components/parameters/CameraId" }]
    get:
      tags: [cameras]
      summary: Metadados de hardware capturados da câmera
      x-auth: camera
      responses:
        "200":
          description: Snapshot EAV de chaves namespaced (`model`, `serial`, `stream.main.gop`…).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceInfo" }
        "404": { description: Nunca capturado para esta câmera. }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/cameras/{id}/device-info/refresh:
    parameters: [{ $ref: "#/components/parameters/CameraId" }]
    post:
      tags: [cameras]
      summary: Recoleta os metadados de hardware sob demanda
      x-auth: admin
      responses:
        "200": { description: Coleta concluída. }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------- live
  /api/cameras/{id}/webrtc:
    parameters: [{ $ref: "#/components/parameters/CameraId" }]
    post:
      tags: [live]
      summary: Handshake WebRTC (WHEP-style offer → answer)
      description: |
        Envie a offer SDP; receba a answer. O ICE é gerado por completo antes da
        resposta (sem trickle).

        **`409` é esperado** quando a câmera não tem publisher — ou seja, não é
        H.264, ou `live_transport=hls`. O cliente deve então cair para o HLS em
        `/stream/{camera_id}/index.m3u8`.
      x-auth: camera
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sdp]
              properties:
                sdp: { type: string, description: Offer SDP. }
      responses:
        "200":
          description: Answer SDP.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sdp: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: WebRTC indisponível para esta câmera — faça fallback para HLS.
          content:
            text/plain:
              schema: { type: string, examples: ["webrtc unavailable for this camera"] }
        "500": { description: Falha na negociação. }

  /stream/{camera_id}/{file}:
    parameters:
      - { name: camera_id, in: path, required: true, schema: { type: string } }
      - name: file
        in: path
        required: true
        description: "`index.m3u8` ou um segmento `.ts`."
        schema: { type: string }
    get:
      tags: [live]
      summary: Playlist e segmentos HLS
      description: |
        Handler de arquivos montado por prefixo (fora da tabela de rotas). O
        acesso é validado pela câmera no primeiro segmento do path. A playlist
        vai com `Cache-Control: no-cache`; os segmentos são imutáveis.

        Use `?token=` — o `<video>`/hls.js não envia headers.
      x-auth: camera
      responses:
        "200":
          description: Playlist ou segmento.
          content:
            application/vnd.apple.mpegurl:
              schema: { type: string }
            video/mp2t:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Câmera ou arquivo inexistente. }

  /recordings/{camera_id}/{path}:
    parameters:
      - { name: camera_id, in: path, required: true, schema: { type: string } }
      - name: path
        in: path
        required: true
        description: "`YYYY/MM/DD/YYYYMMDDHHmmss.mp4` ou o JPEG `_motion.jpg`."
        schema: { type: string }
    get:
      tags: [recordings]
      summary: Arquivo de gravação (MP4) ou frame de evento (JPEG)
      description: |
        Handler de arquivos montado por prefixo (fora da tabela de rotas).
        Suporta `Range` (seek no player). Use `?token=` no `<video src>`.
      x-auth: camera
      responses:
        "200":
          description: Arquivo.
          content:
            video/mp4:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
        "206": { description: Conteúdo parcial (requisição `Range`). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Arquivo inexistente. }

  # ---------------------------------------------------------------- recordings
  /api/cameras/{id}/recordings:
    parameters: [{ $ref: "#/components/parameters/CameraId" }]
    get:
      tags: [recordings]
      summary: Gravações de uma câmera num dia
      x-auth: camera
      parameters:
        - { name: date, in: query, schema: { type: string, format: date }, description: "Dia local (`YYYY-MM-DD`); default hoje." }
        - { name: page, in: query, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1 } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        "200":
          description: Gravações do dia.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Recording" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/cameras/{id}/recordings/by-id/{recording_id}:
    parameters:
      - { $ref: "#/components/parameters/CameraId" }
      - { name: recording_id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [recordings]
      summary: Uma gravação pelo id
      description: Usada para resolver um link compartilhável de gravação.
      x-auth: camera
      responses:
        "200":
          description: Gravação.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recording" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Gravação inexistente. }

  /api/cameras/{id}/recordings/{filename}:
    parameters:
      - { $ref: "#/components/parameters/CameraId" }
      - { name: filename, in: path, required: true, schema: { type: string } }
    delete:
      tags: [recordings]
      summary: Apaga uma gravação
      x-auth: admin
      responses:
        "200": { description: Gravação apagada. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Gravação inexistente. }

  /api/recordings:
    get:
      tags: [recordings]
      summary: Gravações de todas as câmeras acessíveis
      x-auth: full
      parameters:
        - { name: date, in: query, schema: { type: string, format: date } }
        - { $ref: "#/components/parameters/CamerasFilter" }
        - { name: motion_only, in: query, schema: { type: boolean } }
        - { name: window, in: query, schema: { type: integer, minimum: 1 }, description: Janela em horas. }
      responses:
        "200":
          description: Gravações agregadas.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Recording" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/cameras/{id}/content-days:
    parameters: [{ $ref: "#/components/parameters/CameraId" }]
    get:
      tags: [recordings]
      summary: Dias com conteúdo (para habilitar o calendário)
      x-auth: camera
      parameters: [{ $ref: "#/components/parameters/ContentKind" }]
      responses:
        "200":
          description: Datas locais distintas com conteúdo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentDays" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/content-days:
    get:
      tags: [recordings]
      summary: Dias com conteúdo, agregado multi-câmera
      x-auth: full
      parameters:
        - { $ref: "#/components/parameters/CamerasFilter" }
        - { $ref: "#/components/parameters/ContentKind" }
      responses:
        "200":
          description: Datas locais distintas com conteúdo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentDays" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/moments:
    get:
      tags: [events]
      summary: "\"Momentos\" agregados (movimento, pessoa, IA, estados)"
      x-auth: full
      parameters:
        - { name: date, in: query, schema: { type: string, format: date } }
        - { $ref: "#/components/parameters/CamerasFilter" }
        - { name: category, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string }, description: Busca textual. }
        - { name: page, in: query, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Momentos ordenados no tempo.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Moment" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/reports/events:
    get:
      tags: [events]
      summary: Histograma de eventos por categoria
      x-auth: full
      parameters:
        - { name: camera, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: bucket, in: query, schema: { type: string }, description: Granularidade do balde. }
      responses:
        "200":
          description: Séries agregadas por categoria.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------------------------------------------------------------- motion
  /api/cameras/{id}/motion:
    parameters: [{ $ref: "#/components/parameters/CameraId" }]
    get:
      tags: [motion]
      summary: Eventos de movimento de uma câmera
      x-auth: camera
      parameters:
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1 } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        "200":
          description: Eventos de movimento.
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/MotionEvent" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/cameras/{id}/motion/live:
    parameters: [{ $ref: "#/components/parameters/CameraId" }]
    get:
      tags: [motion]
      summary: Eventos de movimento ao vivo (SSE)
      description: |
        Server-Sent Events. Cada `data:` é um `MotionEvent` em JSON. Use
        `?token=` — `EventSource` não envia headers.
      x-auth: camera
      responses:
        "200":
          description: Fluxo de eventos.
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/MotionEvent" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/cameras/{id}/motion/scores:
    parameters: [{ $ref: "#/components/parameters/CameraId" }]
    get:
      tags: [motion]
      summary: Score bruto de cada frame (SSE)
      description: Um `data:` por frame de diff — alimenta o gráfico em tempo real.
      x-auth: camera
      responses:
        "200":
          description: Fluxo de scores.
          content:
            text/event-stream:
              schema:
                type: object
                properties:
                  score: { type: number }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/cameras/{id}/motion/region-score:
    parameters: [{ $ref: "#/components/parameters/CameraId" }]
    get:
      tags: [motion]
      summary: Score por região/zona (SSE)
      description: Usado pelo canvas de zonas de exclusão.
      x-auth: camera
      responses:
        "200":
          description: Fluxo de scores por região.
          content:
            text/event-stream:
              schema: { type: object, additionalProperties: true }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/cameras/{id}/motion/daily-peak:
    parameters: [{ $ref: "#/components/parameters/CameraId" }]
    get:
      tags: [motion]
      summary: Maior score bruto do dia corrente
      x-auth: camera
      responses:
        "200":
          description: Pico do dia.
          content:
            application/json:
              schema:
                type: object
                properties:
                  peak: { type: number }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/cameras/{id}/motion/zones:
    parameters: [{ $ref: "#/components/parameters/CameraId" }]
    get:
      tags: [motion]
      summary: Zonas de exclusão da câmera
      x-auth: camera
      responses:
        "200":
          description: Zonas em coordenadas normalizadas (0..1).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Zone" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [motion]
      summary: Substitui as zonas de exclusão
      x-auth: camera
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/Zone" }
      responses:
        "200": { description: Zonas gravadas. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/motion/live:
    get:
      tags: [motion]
      summary: Movimento ao vivo de todas as câmeras acessíveis (SSE)
      x-auth: full
      responses:
        "200":
          description: Fluxo de eventos, multiplexado por câmera.
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/MotionEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------------------------------------------------------------- events
  /api/events/{id}:
    parameters: [{ $ref: "#/components/parameters/EventId" }]
    get:
      tags: [events]
      summary: Um evento pelo id
      x-auth: full
      responses:
        "200":
          description: Evento.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MotionEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { description: Evento inexistente. }

  /api/cameras/{id}/events:
    parameters: [{ $ref: "#/components/parameters/CameraId" }]
    get:
      tags: [events]
      summary: Eventos de uma câmera, paginados e filtráveis
      x-auth: camera
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1 } }
        - { name: label, in: query, schema: { type: string } }
        - { name: unlabeled, in: query, schema: { type: boolean } }
        - { name: dismissed, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Página de eventos.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/cameras/{id}/event-frame:
    parameters: [{ $ref: "#/components/parameters/CameraId" }]
    get:
      tags: [events]
      summary: Extrai um frame JPEG da gravação num instante
      x-auth: camera
      parameters:
        - { name: time, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Frame.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { description: Falha ao extrair o frame. }
        "503": { description: Extração de frame indisponível (sem ffmpeg). }

  /api/events/{id}/label:
    parameters: [{ $ref: "#/components/parameters/EventId" }]
    patch:
      tags: [events]
      summary: Rotula (ou descarta) um evento
      x-auth: full
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
                dismissed: { type: boolean }
      responses:
        "200": { description: Rótulo atualizado. }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/events/{id}/frame:
    parameters: [{ $ref: "#/components/parameters/EventId" }]
    put:
      tags: [events]
      summary: Substitui o frame associado ao evento
      x-auth: full
      responses:
        "200": { description: Frame atualizado. }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/events/{id}/annotations:
    parameters: [{ $ref: "#/components/parameters/EventId" }]
    get:
      tags: [events]
      summary: Anotações (bounding boxes) de um evento
      x-auth: full
      responses:
        "200":
          description: Anotações.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Annotation" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [events]
      summary: Cria uma anotação no evento
      x-auth: full
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Annotation" }
      responses:
        "200":
          description: Anotação criada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Annotation" }
        "400": { $ref: "#/components/responses/BadRequest" }
    delete:
      tags: [events]
      summary: Apaga todas as anotações do evento
      x-auth: full
      responses:
        "200": { description: Anotações apagadas. }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/annotations/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    patch:
      tags: [events]
      summary: Atualiza uma anotação
      x-auth: full
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Annotation" }
      responses:
        "200": { description: Anotação atualizada. }
        "400": { $ref: "#/components/responses/BadRequest" }
    delete:
      tags: [events]
      summary: Apaga uma anotação
      x-auth: full
      responses:
        "200": { description: Anotação apagada. }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/events/bulk:
    delete:
      tags: [events]
      summary: Apaga eventos em lote
      x-auth: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { type: integer, format: int64 }
      responses:
        "200": { description: Eventos apagados. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/events/bulk/dismiss:
    patch:
      tags: [events]
      summary: Descarta eventos em lote
      x-auth: admin
      responses:
        "200": { description: Eventos descartados. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/events/bulk/label:
    patch:
      tags: [events]
      summary: Rotula eventos em lote
      x-auth: admin
      responses:
        "200": { description: Eventos rotulados. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------- notifications
  /api/notifications:
    get:
      tags: [notifications]
      summary: Notificações do usuário autenticado
      x-auth: full
      responses:
        "200":
          description: Lista e contagem de não lidas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items: { $ref: "#/components/schemas/Notification" }
                  unread_count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [notifications]
      summary: Apaga todas as notificações do usuário
      x-auth: full
      responses:
        "200": { description: Notificações apagadas. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/notifications/{id}/read:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [notifications]
      summary: Marca uma notificação como lida
      x-auth: full
      responses:
        "200": { description: Marcada como lida. }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/notifications/read-all:
    post:
      tags: [notifications]
      summary: Marca todas como lidas
      x-auth: full
      responses:
        "200": { description: Todas marcadas como lidas. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/notifications/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    delete:
      tags: [notifications]
      summary: Apaga uma notificação
      x-auth: full
      responses:
        "200": { description: Notificação apagada. }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/notifications/live:
    get:
      tags: [notifications]
      summary: Notificações ao vivo (SSE)
      x-auth: full
      responses:
        "200":
          description: Fluxo de notificações.
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/Notification" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------------------------------------------------------------- me
  /api/me:
    get:
      tags: [me]
      summary: Dados do usuário autenticado
      x-auth: full
      responses:
        "200":
          description: Perfil.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [me]
      summary: Atualiza nome e/ou username
      description: Campos ausentes (`null`) permanecem inalterados.
      x-auth: full
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: [string, "null"] }
                username: { type: [string, "null"] }
      responses:
        "200": { description: Perfil atualizado. }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/me/email/request-change:
    post:
      tags: [me]
      summary: Pede a troca de e-mail (envia código de confirmação)
      x-auth: full
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_email]
              properties:
                new_email: { type: string, format: email }
      responses:
        "200": { description: Código enviado. }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/me/email/confirm-change:
    post:
      tags: [me]
      summary: Confirma a troca de e-mail com o código
      x-auth: full
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200": { description: E-mail trocado. }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/me/preferences:
    get:
      tags: [me]
      summary: Preferências de tema e accent
      x-auth: full
      responses:
        "200":
          description: Preferências.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [me]
      summary: Atualiza tema e/ou accent
      description: |
        Cada campo é opcional e só é validado/persistido quando presente — dá
        para mudar o accent sem sobrescrever o tema.
      x-auth: full
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Preferences" }
      responses:
        "200": { description: Preferências gravadas. }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/me/footer-states:
    get:
      tags: [me]
      summary: Classificadores de estado marcados para o rodapé
      x-auth: full
      responses:
        "200":
          description: Classificadores `footer_enabled` em que o usuário é destinatário.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    classifier_id: { type: integer, format: int64 }
                    camera_id: { type: string }
                    name: { type: string }
                    state: { type: string, description: Vazio até o runner escrever. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------------------------------------------------------------- users
  /api/users:
    get:
      tags: [users]
      summary: Lista usuários
      x-auth: admin
      responses:
        "200":
          description: Usuários.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [users]
      summary: Cria um usuário
      x-auth: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username: { type: string }
                password: { type: string, format: password }
                role: { type: string, enum: [admin, viewer] }
                cameras:
                  type: array
                  items: { type: string }
                  description: Câmeras concedidas (só faz sentido para `viewer`).
                email: { type: string, format: email }
                name: { type: string }
      responses:
        "200":
          description: Usuário criado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      tags: [users]
      summary: Atualiza um usuário
      description: "`password` vazio mantém a senha atual; `cameras` ausente mantém as concessões."
      x-auth: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                role: { type: string, enum: [admin, viewer] }
                password: { type: string, format: password }
                cameras: { type: [array, "null"], items: { type: string } }
                email: { type: string, format: email }
                name: { type: string }
      responses:
        "200": { description: Usuário atualizado. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [users]
      summary: Remove um usuário
      x-auth: admin
      responses:
        "200": { description: Usuário removido. }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------- settings: cameras
  /api/settings/cameras:
    get:
      tags: [settings]
      summary: Câmeras com a configuração completa
      x-auth: admin
      responses:
        "200":
          description: Câmeras.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Camera" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [settings]
      summary: Cadastra uma câmera
      description: |
        A coleta de metadados de hardware dispara em background. `display_order`
        não é aceito aqui — use `PUT /api/settings/cameras/reorder`.
      x-auth: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Camera" }
      responses:
        "200":
          description: Câmera criada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Camera" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/settings/cameras/{id}:
    parameters: [{ $ref: "#/components/parameters/CameraId" }]
    put:
      tags: [settings]
      summary: Atualiza uma câmera
      description: Preserva o `display_order` existente.
      x-auth: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Camera" }
      responses:
        "200": { description: Câmera atualizada. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [settings]
      summary: Remove uma câmera
      x-auth: admin
      parameters:
        - { name: delete_data, in: query, schema: { type: boolean }, description: Apaga também gravações e eventos. }
      responses:
        "200": { description: Câmera removida. }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/settings/cameras/reorder:
    put:
      tags: [settings]
      summary: Reordena as câmeras em lote
      x-auth: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: string }
                  description: Ids na ordem desejada.
      responses:
        "200": { description: Ordem gravada. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/settings/cameras/detect-streams:
    post:
      tags: [settings]
      summary: Proba a URL principal e recomenda o transporte do ao vivo
      description: "`recommended` é `webrtc` sse o codec é H.264; senão `hls`. Probe falho devolve `{}`."
      x-auth: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rtsp_url]
              properties:
                rtsp_url: { type: string }
      responses:
        "200":
          description: Metadados do stream.
          content:
            application/json:
              schema:
                type: object
                properties:
                  codec: { type: string }
                  width: { type: integer }
                  height: { type: integer }
                  recommended: { type: string, enum: [webrtc, hls] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/settings/cameras/detect-substream:
    post:
      tags: [settings]
      summary: Descobre o substream para a detecção de movimento
      description: |
        Deriva candidatos por convenção (Dahua/Intelbras: `subtype=0` → `subtype=1`)
        e devolve o primeiro que probar. Nenhum candidato válido → corpo vazio,
        sem erro.
      x-auth: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rtsp_url]
              properties:
                rtsp_url: { type: string }
      responses:
        "200":
          description: Substream encontrado (ou vazio).
          content:
            application/json:
              schema:
                type: object
                properties:
                  motion_rtsp_url: { type: string }
                  width: { type: integer }
                  height: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/discover:
    get:
      tags: [settings]
      summary: Descobre câmeras na rede local
      x-auth: admin
      responses:
        "200":
          description: Câmeras encontradas.
          content:
            application/json:
              schema: { type: array, items: { type: object, additionalProperties: true } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/discover/streams:
    post:
      tags: [settings]
      summary: Lista os streams de um dispositivo descoberto
      x-auth: admin
      responses:
        "200":
          description: Streams do dispositivo.
          content:
            application/json:
              schema: { type: array, items: { type: object, additionalProperties: true } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------- settings: storage
  /api/settings/storage:
    put:
      tags: [settings]
      summary: Atualiza as configurações de storage
      x-auth: admin
      responses:
        "200": { description: Storage atualizado. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/drives:
    get:
      tags: [settings]
      summary: Lista os drives S3
      x-auth: admin
      responses:
        "200":
          description: Drives.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Drive" } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [settings]
      summary: Cria um drive S3
      x-auth: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Drive" }
      responses:
        "200": { description: Drive criado. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/drives/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      tags: [settings]
      summary: Atualiza um drive
      x-auth: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Drive" }
      responses:
        "200": { description: Drive atualizado. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [settings]
      summary: Remove um drive
      x-auth: admin
      responses:
        "200": { description: Drive removido. }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/retention:
    get:
      tags: [settings]
      summary: Retenção por categoria
      x-auth: admin
      responses:
        "200":
          description: Configurações de retenção.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/RetentionConfig" } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/retention/{category}:
    parameters:
      - { name: category, in: path, required: true, schema: { type: string } }
    put:
      tags: [settings]
      summary: Atualiza a retenção de uma categoria
      x-auth: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetentionConfig" }
      responses:
        "200": { description: Retenção atualizada. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------- analysis
  /api/settings/analysis:
    get:
      tags: [analysis]
      summary: Configuração global de análise YOLO
      x-auth: admin
      responses:
        "200":
          description: Configuração.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [analysis]
      summary: Atualiza a configuração de análise
      x-auth: admin
      responses:
        "200": { description: Configuração atualizada. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/settings/analysis/models:
    get:
      tags: [analysis]
      summary: Modelos YOLO disponíveis
      x-auth: admin
      responses:
        "200":
          description: Modelos.
          content:
            application/json:
              schema: { type: array, items: { type: string } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/settings/analysis/reanalyze:
    post:
      tags: [analysis]
      summary: Reanalisa gravações já existentes
      x-auth: admin
      responses:
        "200": { description: Reanálise iniciada. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/settings/analysis/annotation-count:
    get:
      tags: [analysis]
      summary: Quantidade de anotações disponíveis para treino
      x-auth: admin
      responses:
        "200":
          description: Contagem.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/settings/analysis/finetune:
    post:
      tags: [analysis]
      summary: Inicia um treino de detecção (assíncrono)
      x-auth: admin
      responses:
        "200":
          description: Job criado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/settings/analysis/finetune/status/{job_id}:
    parameters: [{ $ref: "#/components/parameters/JobId" }]
    get:
      tags: [analysis]
      summary: Status de um treino
      x-auth: admin
      responses:
        "200":
          description: Status do job.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Job inexistente. }

  /api/settings/analysis/finetune/{job_id}:
    parameters: [{ $ref: "#/components/parameters/JobId" }]
    delete:
      tags: [analysis]
      summary: Cancela um treino
      x-auth: admin
      responses:
        "200": { description: Treino cancelado. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Job inexistente. }

  /api/settings/cameras/{id}/analysis:
    parameters: [{ $ref: "#/components/parameters/CameraId" }]
    get:
      tags: [analysis]
      summary: Configuração de análise de uma câmera
      x-auth: admin
      responses:
        "200":
          description: Configuração.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [analysis]
      summary: Atualiza a análise de uma câmera
      x-auth: admin
      responses:
        "200": { description: Configuração atualizada. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------- state classification
  /api/settings/cameras/{id}/classifiers:
    parameters: [{ $ref: "#/components/parameters/CameraId" }]
    get:
      tags: [state-classification]
      summary: Classificadores de estado da câmera
      x-auth: admin
      responses:
        "200":
          description: Classificadores.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Classifier" } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [state-classification]
      summary: Cria um classificador (mínimo 2 classes)
      x-auth: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Classifier" }
      responses:
        "200":
          description: Classificador criado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Classifier" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/settings/cameras/{id}/classifiers/{cid}:
    parameters:
      - { $ref: "#/components/parameters/CameraId" }
      - { $ref: "#/components/parameters/ClassifierId" }
    put:
      tags: [state-classification]
      summary: Atualiza um classificador
      x-auth: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Classifier" }
      responses:
        "200": { description: Classificador atualizado. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [state-classification]
      summary: Remove um classificador
      x-auth: admin
      responses:
        "200": { description: Classificador removido. }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/settings/cameras/{id}/classifiers/{cid}/train:
    parameters:
      - { $ref: "#/components/parameters/CameraId" }
      - { $ref: "#/components/parameters/ClassifierId" }
    post:
      tags: [state-classification]
      summary: Treina o modelo do classificador
      description: |
        Com `samples` no corpo, salva os crops enviados e treina. **Sem corpo**,
        recorta server-side as amostras já persistidas. Exige ≥2 classes. Treina
        um modelo por classificador (`custom-cls-{cid}`).
      x-auth: admin
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                samples:
                  type: array
                  items:
                    type: object
                    properties:
                      label: { type: string }
                      image_b64: { type: string }
      responses:
        "200":
          description: Treino disparado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/settings/cameras/{id}/classifiers/{cid}/samples:
    parameters:
      - { $ref: "#/components/parameters/CameraId" }
      - { $ref: "#/components/parameters/ClassifierId" }
    get:
      tags: [state-classification]
      summary: Amostras persistidas do classificador
      x-auth: admin
      responses:
        "200":
          description: Amostras (frames inteiros) usadas para reidratar o form.
          content:
            application/json:
              schema:
                type: object
                properties:
                  samples:
                    type: array
                    items:
                      type: object
                      properties:
                        label: { type: string }
                        image_path: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [state-classification]
      summary: Persiste amostras do classificador
      x-auth: admin
      responses:
        "200": { description: Amostras gravadas. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/cameras/{id}/classifiers/{cid}/state:
    parameters:
      - { $ref: "#/components/parameters/CameraId" }
      - { $ref: "#/components/parameters/ClassifierId" }
    get:
      tags: [state-classification]
      summary: Estado atual do classificador
      description: Devolve `null` enquanto o runner não escreveu nenhuma leitura.
      x-auth: camera
      responses:
        "200":
          description: Estado corrente (ou `null`).
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/ClassifierState" }
                  - { type: "null" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/cameras/{id}/classifiers/{cid}/history:
    parameters:
      - { $ref: "#/components/parameters/CameraId" }
      - { $ref: "#/components/parameters/ClassifierId" }
    get:
      tags: [state-classification]
      summary: Histórico de transições de estado
      x-auth: camera
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Transições, mais recentes primeiro.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClassifierState" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "`Authorization: Bearer <token>` — forma preferida."
    tokenQuery:
      type: apiKey
      in: query
      name: token
      description: |
        `?token=<token>` — para clientes que não definem headers
        (`<video src>`, `EventSource`, `<img src>`).

  parameters:
    CameraId:
      name: id
      in: path
      required: true
      description: Id da câmera.
      schema: { type: string }
    EventId:
      name: id
      in: path
      required: true
      description: Id do evento.
      schema: { type: integer, format: int64 }
    ClassifierId:
      name: cid
      in: path
      required: true
      description: Id do classificador.
      schema: { type: integer, format: int64 }
    JobId:
      name: job_id
      in: path
      required: true
      schema: { type: string }
    CamerasFilter:
      name: cameras
      in: query
      description: Ids separados por vírgula; vazio = todas as acessíveis.
      schema: { type: string }
    ContentKind:
      name: kind
      in: query
      description: Que tipo de conteúdo conta como "dia com conteúdo".
      schema:
        type: string
        enum: [recordings, events, all]
        default: all

  responses:
    BadRequest:
      description: Requisição malformada.
      content:
        text/plain:
          schema: { type: string, examples: ["invalid body"] }
    Unauthorized:
      description: Token ausente, inválido ou expirado.
      content:
        text/plain:
          schema: { type: string, examples: ["unauthorized"] }
    Forbidden:
      description: |
        Sem permissão — papel insuficiente, sem acesso à câmera, ou token com
        `must_change_password=true` (corpo `password change required`).
      content:
        text/plain:
          schema: { type: string, examples: ["forbidden"] }
    DatabaseUnavailable:
      description: Banco indisponível.
      content:
        text/plain:
          schema: { type: string, examples: ["database unavailable"] }

  schemas:
    Camera:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        rtsp_url: { type: string }
        motion_rtsp_url:
          type: string
          description: |
            Substream opcional para a detecção de movimento (corta o custo de
            decode em ~6–9×). Vazio = usa a `rtsp_url`.
        chunk_duration: { type: string, examples: ["10m"] }
        reconnect_interval: { type: string, examples: ["5s"] }
        video_codec: { type: string, examples: [h264] }
        has_audio: { type: [boolean, "null"] }
        width: { type: integer }
        height: { type: integer }
        hls_video_mode: { type: string }
        record_video_mode: { type: string }
        live_transport:
          type: string
          enum: [auto, webrtc, hls]
          default: auto
          description: |
            `auto` = WebRTC com fallback HLS · `webrtc` = só WebRTC (não sobe o
            pipeline HLS) · `hls` = só HLS.
        hls_segment_seconds: { type: [integer, "null"] }
        hls_list_size: { type: [integer, "null"] }
        hls_dvr_seconds:
          type: [integer, "null"]
          description: "> 0 liga o modo DVR (mantém a janela inteira, com `EXT-X-PROGRAM-DATE-TIME`)."
        recording_enabled: { type: boolean }
        motion: { $ref: "#/components/schemas/MotionConfig" }

    MotionConfig:
      type: object
      properties:
        enabled: { type: boolean }
        threshold: { type: number }
        fps: { type: integer }
        cooldown_seconds: { type: integer }
        capture_width: { type: integer }
        capture_height: { type: integer }
        playback_lead_seconds: { type: integer }
        playback_trail_seconds: { type: integer }

    CameraStats:
      type: object
      properties:
        id: { type: string }
        top_motion_score: { type: number }
        min_motion_score: { type: number }
        online: { type: boolean }
        last_recording_at: { type: [string, "null"], format: date-time }
        motion_enabled: { type: boolean }

    Recording:
      type: object
      properties:
        id: { type: integer, format: int64 }
        filename: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        url: { type: string, description: Caminho sob `/recordings/`. }
        is_recording: { type: boolean, description: Chunk ainda aberto (sem `end`). }
        has_motion: { type: boolean }
        detections:
          type: array
          items: { $ref: "#/components/schemas/Detection" }

    Detection:
      type: object
      properties:
        label: { type: string }
        confidence: { type: number }
        frame_count: { type: integer }
        custom_model: { type: boolean }

    MotionEvent:
      type: object
      properties:
        id: { type: integer, format: int64 }
        camera_id: { type: string }
        time: { type: string, format: date-time }
        score: { type: number }
        frame: { type: string, description: "Caminho do JPEG anotado (`_motion.jpg`)." }
        bbox: { $ref: "#/components/schemas/Bbox" }

    Bbox:
      type: object
      description: Coordenadas normalizadas (0..1).
      properties:
        x: { type: number }
        y: { type: number }
        w: { type: number }
        h: { type: number }

    Zone:
      type: object
      description: Zona de exclusão, em coordenadas normalizadas (0..1).
      additionalProperties: true

    Moment:
      type: object
      properties:
        camera_id: { type: string }
        camera_name: { type: string }
        time: { type: string, format: date-time }
        kind: { type: string, description: "Origem: movimento, pessoa, IA, estado." }
        label: { type: string }
        category: { type: string }
        frame: { type: string }
        score: { type: number }

    Annotation:
      type: object
      description: Bounding box rotulado, base do dataset de fine-tuning.
      properties:
        id: { type: integer, format: int64 }
        label: { type: string }
        bbox_x: { type: number }
        bbox_y: { type: number }
        bbox_w: { type: number }
        bbox_h: { type: number }
        rotation_deg: { type: number }

    Notification:
      type: object
      properties:
        id: { type: integer, format: int64 }
        type: { type: string, examples: [info] }
        title: { type: string }
        message: { type: string }
        link: { type: string, description: Rota da SPA; torna a notificação clicável. }
        created_at: { type: string, format: date-time }
        read: { type: boolean }
        read_at: { type: string, format: date-time }

    User:
      type: object
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        role: { type: string, enum: [admin, viewer] }
        cameras:
          type: array
          items: { type: string }
          description: Câmeras concedidas ao viewer (admin acessa todas).
        created_at: { type: string, format: date-time }
        email: { type: string, format: email }
        name: { type: string }

    Preferences:
      type: object
      properties:
        theme: { type: string, enum: [dark, light, system] }
        accent: { type: string, enum: [default, violet, teal, coral, amber] }

    About:
      type: object
      properties:
        version: { type: string }
        commit: { type: string }
        built_at: { type: string }
        uptime_seconds: { type: number }
        go_version: { type: string }
        release_notes_version:
          type: string
          description: Ausente quando não há release publicada para a versão exata instalada.
        release_notes_md: { type: string }

    Stats:
      type: object
      properties:
        recordings_bytes: { type: integer, format: int64 }
        recordings_count: { type: integer }
        recordings_duration_seconds: { type: number }
        forecast_seconds: { type: number, description: Tempo estimado até encher o disco. }
        disk_total_bytes: { type: integer, format: int64 }
        disk_free_bytes: { type: integer, format: int64 }
        camera_count: { type: integer }
        connected_clients: { type: integer }
        max_size_bytes: { type: integer, format: int64 }
        warn_percent: { type: number }
        os: { type: string }
        pid: { type: integer }
        cpu_percent: { type: number }
        net_mbps: { type: number }
        mem_rss_bytes: { type: integer, format: int64 }
        cameras:
          type: array
          items: { $ref: "#/components/schemas/CameraStats" }

    ContentDays:
      type: object
      properties:
        days:
          type: array
          items: { type: string, format: date }
          description: Datas locais (no fuso do servidor) que têm conteúdo.

    DeviceInfo:
      type: object
      properties:
        collected_at: { type: string, format: date-time }
        values:
          type: object
          additionalProperties: { type: string }
          description: |
            Chaves namespaced e planas (`model`, `serial`, `firmware`, `mac`,
            `stream.main.gop`, `collector`, além do dump bruto em `raw.*`).

    Drive:
      type: object
      description: Destino S3 para envio de gravações.
      additionalProperties: true

    RetentionConfig:
      type: object
      properties:
        category: { type: string }
        action: { type: string, enum: [delete, send_to_drive] }
      additionalProperties: true

    Classifier:
      type: object
      properties:
        id: { type: integer, format: int64 }
        camera_id: { type: string }
        name: { type: string }
        interval_seconds: { type: integer, description: 0 desliga o runner. }
        threshold: { type: number }
        notify_enabled: { type: boolean, default: true }
        footer_enabled: { type: boolean, default: false }
        classes:
          type: array
          minItems: 2
          items: { type: string }
      additionalProperties: true

    ClassifierState:
      type: object
      properties:
        state: { type: string }
        changed_at: { type: string, format: date-time }
      additionalProperties: true
